name: Security validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Export resolved lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Export public lockfile text for review
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const b = fs.readFileSync('package-lock.json').toString('base64'); for (let i=0;i<b.length;i+=8000) console.log('LOCKFILE_CHUNK:'+b.slice(i,i+8000));"
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm audit --audit-level=high
